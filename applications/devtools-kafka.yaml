apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devtools-kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/juanfranciscofernandezherreros/gitops-config.git
    targetRevision: HEAD
    path: manifests/devtools-kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools-kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
  revisionHistoryLimit: 10
