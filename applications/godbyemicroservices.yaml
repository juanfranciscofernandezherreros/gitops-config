apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: godbyemicroservices
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juanfranciscofernandezherreros/gitops-config.git
    targetRevision: HEAD
    path: manifests/godbyemicroservices
  destination:
    server: https://kubernetes.default.svc
    namespace: godbyemicroservices
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
