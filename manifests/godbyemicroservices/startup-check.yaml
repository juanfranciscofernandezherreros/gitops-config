apiVersion: batch/v1
kind: Job
metadata:
  name: godbyemicroservices-startup-check
  namespace: godbyemicroservices
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: startup-check
          image: godbyemicroservices:local
          imagePullPolicy: Never
          env:
            - name: OOM_ON_STARTUP
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 100Mi
