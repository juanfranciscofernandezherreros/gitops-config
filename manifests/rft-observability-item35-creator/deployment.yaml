apiVersion: apps/v1
kind: Deployment
metadata:
  name: rft-observability-item35-creator
  namespace: rft-observability-item35
  labels:
    app.kubernetes.io/name: rft-observability-item35-creator
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rft-observability-item35-creator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rft-observability-item35-creator
    spec:
      containers:
        - name: rft-observability-item35-creator
          image: rft-observability-item35-creator:local
          imagePullPolicy: Never
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s,uk
          ports:
            - name: http
              containerPort: 8042
            - name: management
              containerPort: 9040
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: reports
              mountPath: /data/reports
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: rft-observability-item35-reports
