apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: godbyemicroservices-postgres-oom
data:
  01-goodbye-records.sql: |
    CREATE TABLE IF NOT EXISTS goodbye_record (id BIGINT PRIMARY KEY, payload VARCHAR(64) NOT NULL);
    INSERT INTO goodbye_record (id, payload)
    SELECT value, 'goodbye-' || value FROM generate_series(1, 1000000) AS value
    ON CONFLICT (id) DO NOTHING;
